
# Nginx site for Devine (kavithahostel.me).
# Serves the built frontend and reverse-proxies /api + /socket.io to the Node backend.
# certbot --nginx will add the HTTPS (443) server block + redirect automatically.
server {
    listen 80;
    listen [::]:80;
    server_name kavithahostel.me www.kavithahostel.me;

    root /var/www/devine/frontend/dist;
    index index.html;

    # gzip static text/asset responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/font-woff2;

    # REST API -> Node/Express backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 60m;
    }

    # Socket.IO (live leads/orders) — needs websocket upgrade
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite build assets are content-hashed -> cache forever, immutable.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Static images / fonts from the public folder -> cache 30 days.
    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|woff2?|ttf|eot|mp4|otf)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # index.html must not be cached so new deploys (new asset hashes) are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA fallback for the React app (client-side routes like /product/:id, /admin)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
