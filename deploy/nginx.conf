
# Nginx site for Devine (kavithahostel.me).
# Serves the built frontend and reverse-proxies /api + /socket.io to the Node backend.
# certbot --nginx will add the HTTPS (443) server block + redirect automatically.
server {
    listen 80;
    listen [::]:80;
    server_name kavithahostel.me www.kavithahostel.me;

    root /var/www/devine/frontend/dist;
    index index.html;

    # REST API -> Node/Express backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    # Socket.IO (live leads/orders) — needs websocket upgrade
    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback for the React app (client-side routes like /product/:id, /admin)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
