services:
  - type: web
    name: devine-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: PORT
        value: 5000
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      # WhatsApp / Meta
      - key: WA_VERIFY_TOKEN
        sync: false
      - key: WA_APP_ID
        sync: false
      - key: WA_APP_SECRET
        sync: false
      - key: WA_B2B_TOKEN
        sync: false
      - key: WA_B2B_PHONE_NUMBER_ID
        sync: false
      - key: WA_B2B_WABA_ID
        sync: false
      - key: WA_B2C_TOKEN
        sync: false
      - key: WA_B2C_PHONE_NUMBER_ID
        sync: false
      - key: WA_B2C_WABA_ID
        sync: false
      # Cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
